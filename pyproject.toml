[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-engineering-learning-lab"
version = "0.1.0"
description = "A progressive, framework-light Agent engineering learning lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "fastmcp>=2.0", "httpx>=0.27", "openai>=1.0", "pydantic>=2.7", "pydantic-settings>=2.2", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
advanced = ["jupyterlab>=4.0", "langgraph>=1.0", "langfuse>=3.0", "ragas>=0.3", "numpy>=1.26"]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]
